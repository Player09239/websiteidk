<!DOCTYPE html>
<html>
    <head>
        <script type="module" src="../scripts/mainScript.js"></script>
        <script type="module" src="../scripts/globals.js"></script>
        <script type="module" src="../scripts/intervals/automaticIncome.js"></script>
        <script type="module" src="../scripts/intervals/automaticCombo.js"></script>
        <link rel="stylesheet" href="../css/mainStyles.css">
        <link rel="stylesheet" href="../css/upgradeStyles.css">
        <title>BREAD CLICKER >:D</title>
    </head>
    <body>
        <div id="buttonContainer">
            <button id="breadButton">
                <img src="../images/bread.png" id="breadImage">
            </button>
            <div id="comboContainer">
                <img id="combo5" class="combo" src="../images/bread.png">
                <img id="combo4" class="combo" src="../images/bread.png">
                <img id="combo3" class="combo" src="../images/bread.png">
                <img id="combo2" class="combo" src="../images/bread.png">
                <img id="combo1" class="combo" src="../images/bread.png">
            </div>
        </div>
        <div id="counterContainer">
            <p id="breadCounter">
                0
            </p>
            <p id="breadPerSecondCounter">
                0 Bread per second
            </p>
            <img id="breadIcon" src="../images/bread.png">
        </div>
        <div id="upgradesContainer">
            <p id="upgradesLabel"><strong>UPGRADES</strong></p>
            <div id="upgrade1Container">
                <p id="upgrade1Name" class="upgradeName"><strong>Bready Hands</strong></p>
                <p id="upgrade1Level" class="upgradeLevel">Lv.1</p>
                <button id="upgrade1Button" class="upgradeButton">Buy | 10 Bread</button>
            </div>
            <div id="upgrade2Container">
                <p id="upgrade2Name" class="upgradeName"><strong>Breadier Hands</strong></p>
                <p id="upgrade2Level" class="upgradeLevel">Lv.1</p>
                <button id="upgrade2Button" class="upgradeButton">Buy | 175 Bread</button>
            </div>
            <div id="upgrade3Container">
                <p id="upgrade3Name" class="upgradeName"><strong>Bread Worker</strong></p>
                <p id="upgrade3Level" class="upgradeLevel">Lv.1</p>
                <button id="upgrade3Button" class="upgradeButton">Buy | 300 Bread</button>
            </div>
        </div>
    </body>
</html>
